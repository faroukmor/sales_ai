server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
  location = /health { proxy_pass http://api:8000/health; proxy_set_header Host $host; }
  # index.html must never be cached, otherwise the browser keeps loading an old bundle
  # (and /admin shows 404) even after the frontend image is rebuilt.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; }
}
